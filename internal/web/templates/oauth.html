{{define "content"}}
<nav class="crumbs" aria-label="Breadcrumb"><a href="/accounts/new">Add account</a><span aria-hidden="true">/</span><span>{{.Label}}</span></nav>
<h1>Connect {{.Label}}</h1>
{{if .Error}}<div class="alert" role="alert">{{template "icon-alert"}}<span>{{.Error}}</span></div>{{end}}
<section class="panel narrow">
  <ol class="steps">
    <li><a class="btn btn-primary" href="{{.AuthURL}}" target="_blank" rel="noopener noreferrer">Open sign-in page</a></li>
    <li>{{.Instructions}}</li>
    <li>
      <form method="post" action="/oauth/finish" class="form">
        <input type="hidden" name="pending" value="{{.PendingID}}">
        <div class="field"><label for="code">Code or URL</label><input id="code" name="code" required autocomplete="off" spellcheck="false"></div>
        <button class="btn btn-primary">Finish</button>
      </form>
    </li>
  </ol>
</section>
{{end}}
