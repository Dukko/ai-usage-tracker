services:
  ai-usage-tracker:
    build: .
    container_name: ai-usage-tracker
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TRACKER_PASSWORD: ${TRACKER_PASSWORD:?set TRACKER_PASSWORD in .env}
      TRACKER_POLL_INTERVAL: 10m
      # TRACKER_SECRET_KEY: optional passphrase for encrypting stored credentials;
      # if unset, a random key is generated in /data/secret.key
    volumes:
      - tracker-data:/data

volumes:
  tracker-data:
